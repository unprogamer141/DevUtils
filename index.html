<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevUtils – Offline Developer Toolkit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet" />
    <style>
        /* --- CSS Reset & Variables --- */
        :root {
            --bg-primary: #0b1120;
            --bg-card: #111b2e;
            --bg-input: #0a111f;
            --border-color: #1e293b;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --shadow: 0 8px 24px rgba(0,0,0,0.4);
            --radius: 12px;
        }
        .light-theme {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --border-color: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            transition: background 0.2s, color 0.2s;
        }
        .container {
            max-width: 1000px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #94a3b8, #f1f5f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.15s;
        }
        .theme-toggle:hover { opacity: 0.8; }
        .sub {
            color: var(--text-secondary);
            margin-bottom: 28px;
            font-size: 0.95rem;
            border-left: 3px solid var(--accent);
            padding-left: 16px;
        }
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 4px;
            margin-bottom: 28px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 30px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .tab-btn:hover { background: var(--border-color); color: var(--text-primary); }
        .tab-btn.active { background: var(--accent); color: #fff; }
        .tool-panel {
            display: none;
            animation: fade 0.2s ease;
        }
        .tool-panel.active { display: block; }
        @keyframes fade { 0% { opacity: 0.4; } 100% { opacity: 1; } }
        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: background 0.2s, border 0.2s;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
            margin-top: 16px;
        }
        label:first-of-type { margin-top: 0; }
        textarea, input[type="text"], input[type="number"], input[type="color"] {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: 'Inter', monospace;
            font-size: 0.9rem;
            outline: none;
            transition: border 0.15s;
            resize: vertical;
        }
        textarea:focus, input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        textarea { min-height: 100px; }
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 14px 0 6px;
        }
        .btn {
            background: var(--accent);
            border: none;
            color: #fff;
            font-weight: 500;
            padding: 10px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            transition: background 0.15s, transform 0.1s;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn:active { transform: scale(0.97); }
        .btn-secondary {
            background: var(--border-color);
            color: var(--text-primary);
        }
        .btn-secondary:hover { opacity: 0.8; }
        .output-box {
            background: var(--bg-input);
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-top: 14px;
            white-space: pre-wrap;
            word-break: break-all;
            font-family: 'Inter', monospace;
            font-size: 0.9rem;
            max-height: 300px;
            overflow: auto;
            position: relative;
        }
        .copy-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.15s;
        }
        .copy-btn:hover { background: var(--accent); color: #fff; }
        .flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
        }
        .flex-row > * { flex: 1; min-width: 140px; }
        .badge {
            display: inline-block;
            background: var(--border-color);
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .qr-box {
            display: flex;
            justify-content: center;
            padding: 16px 0;
        }
        #qrResult img { border-radius: 12px; }
        .color-preview {
            display: inline-block;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            vertical-align: middle;
            margin-left: 12px;
        }
        .counter {
            background: var(--bg-input);
            padding: 6px 14px;
            border-radius: 30px;
            display: inline-block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 8px;
        }
        @media (max-width: 600px) {
            h1 { font-size: 1.7rem; }
            .tabs { gap: 4px; }
            .tab-btn { font-size: 0.75rem; padding: 6px 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧰 DevUtils</h1>
            <button class="theme-toggle" id="themeToggle">🌙 Dark</button>
        </div>
        <div class="sub">Single‑page offline toolkit – now with more tools</div>

        <!-- Tabs -->
        <div class="tabs" id="tabContainer">
            <button class="tab-btn active" data-tab="json">JSON</button>
            <button class="tab-btn" data-tab="base64">Base64</button>
            <button class="tab-btn" data-tab="uuid">UUID</button>
            <button class="tab-btn" data-tab="password">Password</button>
            <button class="tab-btn" data-tab="timestamp">Timestamp</button>
            <button class="tab-btn" data-tab="regex">Regex</button>
            <button class="tab-btn" data-tab="diff">Diff</button>
            <button class="tab-btn" data-tab="color">Color</button>
            <button class="tab-btn" data-tab="qr">QR</button>
            <button class="tab-btn" data-tab="url">URL</button>
            <button class="tab-btn" data-tab="counter">Counter</button>
        </div>

        <!-- Panel: JSON -->
        <div class="tool-panel active" id="panel-json">
            <div class="card">
                <label>Paste JSON</label>
                <textarea id="jsonInput" placeholder='{"hello": "world"}'></textarea>
                <div class="row">
                    <button class="btn" id="jsonFormat">Format</button>
                    <button class="btn btn-secondary" id="jsonValidate">Validate</button>
                    <button class="btn btn-secondary" id="jsonMinify">Minify</button>
                </div>
                <div id="jsonOutput" class="output-box"><button class="copy-btn" data-target="jsonOutput">Copy</button></div>
            </div>
        </div>

        <!-- Panel: Base64 -->
        <div class="tool-panel" id="panel-base64">
            <div class="card">
                <label>Enter text</label>
                <textarea id="b64Input">Hello, DevUtils!</textarea>
                <div class="row">
                    <button class="btn" id="b64Encode">Encode</button>
                    <button class="btn btn-secondary" id="b64Decode">Decode</button>
                </div>
                <div id="b64Output" class="output-box"><button class="copy-btn" data-target="b64Output">Copy</button></div>
            </div>
        </div>

        <!-- Panel: UUID -->
        <div class="tool-panel" id="panel-uuid">
            <div class="card">
                <label>UUID v4 Generator</label>
                <div class="flex-row">
                    <input type="text" id="uuidOutput" readonly placeholder="Click generate" style="flex:3;" />
                    <button class="btn" id="uuidGen" style="flex:1;">Generate</button>
                </div>
                <div class="row" style="margin-top:12px;">
                    <button class="btn btn-secondary" id="uuidCopy">Copy</button>
                </div>
            </div>
        </div>

        <!-- Panel: Password Generator -->
        <div class="tool-panel" id="panel-password">
            <div class="card">
                <label>Password Generator</label>
                <div class="flex-row">
                    <input type="number" id="passLength" value="16" min="4" max="64" style="flex:1;" />
                    <label style="flex:0; margin:0; display:flex; align-items:center; gap:6px;">
                        <input type="checkbox" id="passNumbers" checked /> Numbers
                    </label>
                    <label style="flex:0; margin:0; display:flex; align-items:center; gap:6px;">
                        <input type="checkbox" id="passSymbols" checked /> Symbols
                    </label>
                </div>
                <button class="btn" id="passGenerate" style="margin:12px 0;">Generate</button>
                <div id="passOutput" class="output-box"><button class="copy-btn" data-target="passOutput">Copy</button></div>
            </div>
        </div>

        <!-- Panel: Timestamp -->
        <div class="tool-panel" id="panel-timestamp">
            <div class="card">
                <label>Unix Timestamp (seconds)</label>
                <input type="number" id="tsInput" placeholder="e.g. 1690000000" />
                <button class="btn" id="tsConvert" style="margin:12px 0;">Convert to Date</button>
                <div id="tsOutput" class="output-box"><button class="copy-btn" data-target="tsOutput">Copy</button></div>
                <button class="btn btn-secondary" id="tsNow">Current Timestamp</button>
            </div>
        </div>

        <!-- Panel: Regex -->
        <div class="tool-panel" id="panel-regex">
            <div class="card">
                <label>Text</label>
                <textarea id="regexText">Hello world, hello universe.</textarea>
                <label>Regex Pattern</label>
                <input type="text" id="regexPattern" value="hello" />
                <label>Flags (g, i, m)</label>
                <input type="text" id="regexFlags" value="gi" />
                <button class="btn" id="regexTest" style="margin:12px 0;">Test</button>
                <div id="regexOutput" class="output-box"><button class="copy-btn" data-target="regexOutput">Copy</button></div>
            </div>
        </div>

        <!-- Panel: Diff -->
        <div class="tool-panel" id="panel-diff">
            <div class="card">
                <label>Original text</label>
                <textarea id="diffA">Hello world</textarea>
                <label>Modified text</label>
                <textarea id="diffB">Hello world!</textarea>
                <button class="btn" id="diffCompare" style="margin:12px 0;">Compare</button>
                <div id="diffOutput" class="output-box"><button class="copy-btn" data-target="diffOutput">Copy</button></div>
            </div>
        </div>

        <!-- Panel: Color -->
        <div class="tool-panel" id="panel-color">
            <div class="card">
                <label>Pick a color</label>
                <input type="color" id="colorPicker" value="#3b82f6" />
                <div style="margin-top:16px;">
                    <span class="color-preview" id="colorPreview" style="background:#3b82f6;"></span>
                    <span id="colorHex">#3b82f6</span>
                </div>
                <label>RGB</label>
                <input type="text" id="colorRgb" readonly value="rgb(59, 130, 246)" />
                <label>HSL</label>
                <input type="text" id="colorHsl" readonly value="hsl(217, 91%, 60%)" />
            </div>
        </div>

        <!-- Panel: QR -->
        <div class="tool-panel" id="panel-qr">
            <div class="card">
                <label>Text or URL</label>
                <input type="text" id="qrInput" value="https://github.com" />
                <button class="btn" id="qrGenerate" style="margin:12px 0;">Generate QR</button>
                <div id="qrResult" class="qr-box"></div>
            </div>
        </div>

        <!-- Panel: URL Encoder/Decoder -->
        <div class="tool-panel" id="panel-url">
            <div class="card">
                <label>Enter text or URL</label>
                <textarea id="urlInput">https://example.com/hello world?q=test</textarea>
                <div class="row">
                    <button class="btn" id="urlEncode">Encode</button>
                    <button class="btn btn-secondary" id="urlDecode">Decode</button>
                </div>
                <div id="urlOutput" class="output-box"><button class="copy-btn" data-target="urlOutput">Copy</button></div>
            </div>
        </div>

        <!-- Panel: Character / Word Counter -->
        <div class="tool-panel" id="panel-counter">
            <div class="card">
                <label>Paste or type text</label>
                <textarea id="counterInput" placeholder="Write something..."></textarea>
                <div id="counterStats" class="counter">Characters: 0 | Words: 0 | Lines: 0</div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        // ---- Theme toggle ----
        document.getElementById('themeToggle').addEventListener('click', function() {
            document.body.classList.toggle('light-theme');
            this.textContent = document.body.classList.contains('light-theme') ? '☀️ Light' : '🌙 Dark';
        });

        // ---- Tabs ----
        const tabs = document.querySelectorAll('.tab-btn');
        const panels = document.querySelectorAll('.tool-panel');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                panels.forEach(p => p.classList.remove('active'));
                document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
            });
        });

        // ---- Generic copy function ----
        document.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const targetId = this.dataset.target;
                const outputEl = document.getElementById(targetId);
                let text = outputEl.textContent;
                // Remove any inner copy button text (if present)
                const copyBtnIn = outputEl.querySelector('.copy-btn');
                if (copyBtnIn) text = text.replace(copyBtnIn.textContent, '').trim();
                if (text) {
                    navigator.clipboard?.writeText(text).then(() => {
                        const orig = this.textContent;
                        this.textContent = '✅ Copied!';
                        setTimeout(() => this.textContent = orig, 1500);
                    }).catch(() => alert('Copy failed.'));
                }
            });
        });

        // ---- JSON ----
        document.getElementById('jsonFormat').addEventListener('click', () => {
            try { const obj = JSON.parse(document.getElementById('jsonInput').value);
                document.getElementById('jsonOutput').textContent = JSON.stringify(obj, null, 2); }
            catch(e) { document.getElementById('jsonOutput').textContent = '❌ Invalid JSON: ' + e.message; }
        });
        document.getElementById('jsonValidate').addEventListener('click', () => {
            try { JSON.parse(document.getElementById('jsonInput').value);
                document.getElementById('jsonOutput').textContent = '✅ Valid JSON'; }
            catch(e) { document.getElementById('jsonOutput').textContent = '❌ ' + e.message; }
        });
        document.getElementById('jsonMinify').addEventListener('click', () => {
            try { const obj = JSON.parse(document.getElementById('jsonInput').value);
                document.getElementById('jsonOutput').textContent = JSON.stringify(obj); }
            catch(e) { document.getElementById('jsonOutput').textContent = '❌ Invalid JSON'; }
        });

        // ---- Base64 ----
        document.getElementById('b64Encode').addEventListener('click', () => {
            const val = document.getElementById('b64Input').value;
            document.getElementById('b64Output').textContent = btoa(unescape(encodeURIComponent(val)));
        });
        document.getElementById('b64Decode').addEventListener('click', () => {
            try { const val = document.getElementById('b64Input').value;
                document.getElementById('b64Output').textContent = decodeURIComponent(escape(atob(val))); }
            catch(e) { document.getElementById('b64Output').textContent = '❌ Invalid Base64'; }
        });

        // ---- UUID ----
        document.getElementById('uuidGen').addEventListener('click', () => {
            document.getElementById('uuidOutput').value = crypto.randomUUID();
        });
        document.getElementById('uuidCopy').addEventListener('click', () => {
            const val = document.getElementById('uuidOutput').value;
            if (val) { navigator.clipboard?.writeText(val); alert('Copied!'); }
        });

        // ---- Password Generator ----
        function generatePassword(length, useNumbers, useSymbols) {
            let chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
            if (useNumbers) chars += '0123456789';
            if (useSymbols) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
            let password = '';
            for (let i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return password;
        }
        document.getElementById('passGenerate').addEventListener('click', () => {
            const len = parseInt(document.getElementById('passLength').value) || 16;
            const nums = document.getElementById('passNumbers').checked;
            const syms = document.getElementById('passSymbols').checked;
            document.getElementById('passOutput').textContent = generatePassword(len, nums, syms);
        });
        // Generate on load
        document.getElementById('passGenerate').click();

        // ---- Timestamp ----
        document.getElementById('tsConvert').addEventListener('click', () => {
            const val = parseInt(document.getElementById('tsInput').value);
            if (!val) { document.getElementById('tsOutput').textContent = '❌ Enter a valid number.'; return; }
            const d = new Date(val * 1000);
            document.getElementById('tsOutput').textContent = d.toString();
        });
        document.getElementById('tsNow').addEventListener('click', () => {
            document.getElementById('tsInput').value = Math.floor(Date.now() / 1000);
            document.getElementById('tsConvert').click();
        });

        // ---- Regex ----
        document.getElementById('regexTest').addEventListener('click', () => {
            const text = document.getElementById('regexText').value;
            const pattern = document.getElementById('regexPattern').value;
            const flags = document.getElementById('regexFlags').value || '';
            try {
                const re = new RegExp(pattern, flags);
                const matches = text.match(re);
                if (matches) document.getElementById('regexOutput').textContent = matches.map((m,i) => `[${i}] ${m}`).join('\n');
                else document.getElementById('regexOutput').textContent = 'No matches found.';
            } catch(e) { document.getElementById('regexOutput').textContent = '❌ ' + e.message; }
        });

        // ---- Diff ----
        document.getElementById('diffCompare').addEventListener('click', () => {
            const a = document.getElementById('diffA').value;
            const b = document.getElementById('diffB').value;
            let out = '';
            const maxLen = Math.max(a.length, b.length);
            let changes = 0;
            for (let i=0; i<maxLen; i++) {
                if (a[i] !== b[i]) {
                    changes++;
                    out += `❌ Position ${i}: "${a[i]||'undefined'}" → "${b[i]||'undefined'}"\n`;
                }
            }
            if (changes === 0) out = '✅ Texts are identical.';
            else out = `🔁 ${changes} differences found:\n` + out;
            document.getElementById('diffOutput').textContent = out;
        });

        // ---- Color ----
        document.getElementById('colorPicker').addEventListener('input', function() {
            const hex = this.value;
            document.getElementById('colorPreview').style.background = hex;
            document.getElementById('colorHex').textContent = hex;
            const r = parseInt(hex.slice(1,3), 16);
            const g = parseInt(hex.slice(3,5), 16);
            const b = parseInt(hex.slice(5,7), 16);
            document.getElementById('colorRgb').value = `rgb(${r}, ${g}, ${b})`;
            const max = Math.max(r,g,b)/255, min = Math.min(r,g,b)/255;
            let h, s, l = (max+min)/2;
            if (max === min) { h = s = 0; }
            else {
                const d = max-min;
                s = l > 0.5 ? d/(2-max-min) : d/(max+min);
                switch(max) {
                    case r/255: h = ((g-b)/255)/d; break;
                    case g/255: h = 2 + ((b-r)/255)/d; break;
                    case b/255: h = 4 + ((r-g)/255)/d; break;
                }
                h *= 60;
                if (h < 0) h += 360;
            }
            document.getElementById('colorHsl').value = `hsl(${Math.round(h)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`;
        });
        document.getElementById('colorPicker').dispatchEvent(new Event('input'));

        // ---- QR ----
        let qrCode = null;
        document.getElementById('qrGenerate').addEventListener('click', () => {
            const text = document.getElementById('qrInput').value;
            if (!text) { alert('Enter text or URL.'); return; }
            const container = document.getElementById('qrResult');
            container.innerHTML = '';
            if (qrCode) { qrCode.clear(); qrCode = null; }
            qrCode = new QRCode(container, { text: text, width: 200, height: 200, colorDark: '#ffffff', colorLight: '#0b1120' });
        });
        document.getElementById('qrGenerate').click();

        // ---- URL Encoder/Decoder ----
        document.getElementById('urlEncode').addEventListener('click', () => {
            const val = document.getElementById('urlInput').value;
            try { document.getElementById('urlOutput').textContent = encodeURIComponent(val); }
            catch(e) { document.getElementById('urlOutput').textContent = '❌ Error encoding'; }
        });
        document.getElementById('urlDecode').addEventListener('click', () => {
            const val = document.getElementById('urlInput').value;
            try { document.getElementById('urlOutput').textContent = decodeURIComponent(val); }
            catch(e) { document.getElementById('urlOutput').textContent = '❌ Invalid URL encoding'; }
        });

        // ---- Counter ----
        document.getElementById('counterInput').addEventListener('input', function() {
            const text = this.value;
            const chars = text.length;
            const words = text ? text.trim().split(/\s+/).length : 0;
            const lines = text ? text.split('\n').length : 0;
            document.getElementById('counterStats').textContent = `Characters: ${chars} | Words: ${words} | Lines: ${lines}`;
        });
        // Initial update
        document.getElementById('counterInput').dispatchEvent(new Event('input'));

        console.log('DevUtils v2 loaded ✅');
    </script>
</body>
</html>
